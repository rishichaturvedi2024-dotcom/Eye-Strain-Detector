<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eye Strain Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f7f6; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #333; text-align: center; }
        canvas { max-width: 100%; height: 400px; }
        .status { text-align: center; margin-top: 20px; font-weight: bold; color: #555; }
    </style>
</head>
<body>

<div class="container">
    <h1>Digital Eye Strain - Real-time Risk Score</h1>
    <canvas id="riskChart"></canvas>
    <div class="status" id="statusText">Waiting for data...</div>
</div>

<script>
    const ctx = document.getElementById('riskChart').getContext('2d');
    const riskChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [{
                label: 'Risk Score (0.0 - 1.0)',
                data: [],
                borderColor: 'rgba(75, 192, 192, 1)',
                backgroundColor: 'rgba(75, 192, 192, 0.2)',
                borderWidth: 2,
                fill: true,
                tension: 0.3
            }]
        },
        options: {
            scales: {
                y: { beginAtZero: true, max: 1.0 }
            },
            animation: { duration: 0 }
        }
    });

    async function fetchData() {
        try {
            const response = await fetch('/api/data');
            const data = await response.json();
            
            // Format timestamps
            const labels = data.timestamps.map(ts => {
                const date = new Date(ts);
                return date.toLocaleTimeString();
            });

            riskChart.data.labels = labels;
            riskChart.data.datasets[0].data = data.scores;
            riskChart.update();

            const latestScore = data.scores[data.scores.length - 1];
            const hasAlert = data.alerts[data.alerts.length - 1];
            
            if (latestScore !== undefined) {
                let text = "Latest Risk Score: " + latestScore.toFixed(2);
                if (hasAlert) {
                    text += " ⚠️ ALERT DISPATCHED";
                    document.getElementById('statusText').style.color = "red";
                } else {
                    document.getElementById('statusText').style.color = "green";
                }
                document.getElementById('statusText').innerText = text;
            }
        } catch (error) {
            console.error("Error fetching data", error);
        }
    }

    // Refresh every 5 seconds
    setInterval(fetchData, 5000);
    fetchData();
</script>

</body>
</html>
